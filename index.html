<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Educational Flashcards</title>
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <ul class="gallery__list">
          <template id="template">
            <li class="card card_color_green">
              <h3 class="card__title"></h3>
              <a class="card__link" href="#"></a>
              <div class="card__row">
                <p class="card__count"></p>
                <button class="card__delete-btn" type="button"></button>
              </div>
            </li>
          </template>
          <template id="card-template">
            <li class="card">
              <h3 class="card__title"></h3>
              <div class="card__row">
                <button class="card__open-btn" type="button" aria-label="Open deck"></button>
                <button class="card__delete-btn" type="button" aria-label="Delete deck"></button>
              </div>
            </li>
          </template>
        </ul>
        <button class="gallery__new-card-btn" type="button">+ New Deck</button>
      </section>
      <!-- New section copied from home for the feature (per lesson) -->
      <section id="deck-feature" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button class="gallery__new-card-btn" type="button">+ New Card</button>
        </div>
      </section>
      <section id="deck-view" class="deck-view" aria-live="polite">
        <div class="deck-view__header">
          <h2 class="deck-view__title">Deck</h2>
          <div class="deck-view__actions">
            <button class="deck-view__practice-btn" type="button">
              Practice
            </button>
            <button class="deck-view__new-card-btn" type="button">
              + New Card
            </button>
          </div>
        </div>
        <ul class="deck-view__list"></ul>
      </section>
      <section class="carousel" id="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="wrapper">
          <div class="carousel__main">
            <button
              class="carousel__btn carousel__btn_type_left"
              aria-label="left button"
            ></button>
            <div class="carousel__card">
              <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
            </div>
            <button
              class="carousel__btn carousel__btn_type_right"
              aria-label="right button"
            ></button>
          </div>
          <button
            class="carousel__btn carousel__btn_type_flip"
            aria-label="flip button"
          ></button>
        </div>
      </section>
      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">
        &copy; 2026 Miguel Sarría. Enjoy Technology through the life
      </p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
